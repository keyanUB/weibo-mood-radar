[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weibo-mood-radar"
version = "0.2.0"
description = "Weekly and monthly Weibo event and comment emotion reports."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
weibo-mood-radar = "weibo_mood_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
